<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizza Max - Cargando...</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>">

<style>
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
  }

  body {
    background: radial-gradient(circle at center, #3d1a10 0%, #0a0503 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
  }

  /* ==================================================== */
  /* ===== LOGO DE CARGA "PIZZA MAX" ===== */
  /* ==================================================== */
  #loading-screen {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #3d1a10 0%, #0a0503 100%);
    opacity: 1;
    visibility: visible;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }

  #loading-screen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    animation: respirar 3.5s ease-in-out infinite;
  }

  .loader::before {
    content: '';
    position: absolute;
    inset: -80px;
    background: radial-gradient(circle, rgba(255, 160, 0, 0.35) 0%, rgba(255, 100, 0, 0.15) 40%, transparent 70%);
    border-radius: 50%;
    z-index: -1;
    animation: brillo-horno 2.5s ease-in-out infinite alternate;
  }

  /* Vapor saliendo del icono */
  .steam-container {
    position: absolute;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 15px;
    height: 40px;
    pointer-events: none;
  }

  .steam {
    width: 8px;
    height: 40px;
    background: linear-gradient(180deg, transparent 0%, rgba(255, 255, 255, 0.6) 50%, transparent 100%);
    border-radius: 50%;
    filter: blur(4px);
    animation: subir-vapor 3s ease-out infinite;
  }

  .steam:nth-child(2) { animation-delay: 0.8s; }
  .steam:nth-child(3) { animation-delay: 1.6s; }

  /* Icono de la porción de pizza */
  .pizza-slice {
    width: 120px;
    height: 120px;
    margin-bottom: 18px;
    filter: 
      brightness(1.4) 
      drop-shadow(0 8px 15px rgba(0, 0, 0, 0.6)) 
      drop-shadow(0 0 25px rgba(255, 180, 0, 0.8));
    animation: balanceo 2.5s ease-in-out infinite alternate;
  }

  /* Marca "PIZZA MAX" */
  .brand-load {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
  }

  .pizza-word {
    font-size: clamp(52px, 11vw, 72px);
    font-weight: 900;
    letter-spacing: 8px;
    background: linear-gradient(180deg, #ff7070 0%, #ffa040 45%, #ffd740 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    position: relative;
    filter: 
      brightness(1.3) 
      drop-shadow(0 3px 6px rgba(0, 0, 0, 0.6)) 
      drop-shadow(0 0 30px rgba(255, 160, 0, 0.7));
    animation: brillo-pizza 2.5s ease-in-out infinite alternate;
  }

  /* Efecto de brillo que recorre las letras */
  .pizza-word::after {
    content: 'PIZZA';
    position: absolute;
    top: 0;
    left: 0;
    background: linear-gradient(90deg, transparent 25%, rgba(255, 255, 255, 1) 50%, transparent 75%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: recorrer-brillo 3s ease-in-out infinite;
    pointer-events: none;
  }

  .max-word {
    font-size: clamp(26px, 7vw, 40px);
    font-weight: 700;
    letter-spacing: 18px;
    margin-top: 8px;
    padding-left: 18px;
    color: #ffffff;
    text-shadow: 
      0 0 20px rgba(255, 220, 120, 1), 
      0 0 40px rgba(255, 160, 0, 0.8),
      0 0 60px rgba(255, 100, 0, 0.5);
    animation: brillo-max 2.5s ease-in-out infinite alternate;
  }

  /* Puntos de carga */
  .dots-load {
    display: flex;
    gap: 10px;
    margin-top: 40px;
  }

  .dot-load {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: linear-gradient(180deg, #ffd740, #ff5252);
    box-shadow: 
      0 0 15px rgba(255, 180, 0, 1),
      0 0 25px rgba(255, 100, 0, 0.6);
    animation: rebotar-punto 1.4s infinite ease-in-out both;
  }

  .dot-load:nth-child(1) { animation-delay: -0.32s; }
  .dot-load:nth-child(2) { animation-delay: -0.16s; }
  .dot-load:nth-child(3) { animation-delay: 0s; }

  /* ===== ANIMACIONES ===== */
  @keyframes respirar {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }

  @keyframes balanceo {
    0% { transform: rotate(-6deg) translateY(0); }
    100% { transform: rotate(6deg) translateY(-8px); }
  }

  @keyframes brillo-pizza {
    0% { filter: brightness(1.2) drop-shadow(0 3px 6px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 20px rgba(255, 160, 0, 0.5)); }
    100% { filter: brightness(1.4) drop-shadow(0 3px 6px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 40px rgba(255, 200, 0, 1)); }
  }

  @keyframes brillo-max {
    0% { text-shadow: 0 0 12px rgba(255, 220, 120, 0.7), 0 0 25px rgba(255, 140, 0, 0.4); }
    100% { text-shadow: 0 0 25px rgba(255, 220, 120, 1), 0 0 50px rgba(255, 140, 0, 0.8), 0 0 70px rgba(255, 80, 0, 0.4); }
  }

  @keyframes recorrer-brillo {
    0% { background-position: 200% center; }
    100% { background-position: -200% center; }
  }

  @keyframes subir-vapor {
    0% { transform: translateY(20px) scale(0.6); opacity: 0; }
    30% { opacity: 1; }
    100% { transform: translateY(-30px) scale(1.4); opacity: 0; }
  }

  @keyframes brillo-horno {
    0% { opacity: 0.5; transform: scale(0.95); }
    100% { opacity: 1; transform: scale(1.08); }
  }

  @keyframes rebotar-punto {
    0%, 80%, 100% { transform: scale(0.5); opacity: 0.3; }
    40% { transform: scale(1.2); opacity: 1; }
  }
</style>
</head>
<body>

<!-- ===== LOGO DE CARGA ===== -->
<div id="loading-screen" role="status" aria-label="Cargando">
    <div class="loader">
        <div class="steam-container">
            <div class="steam"></div>
            <div class="steam"></div>
            <div class="steam"></div>
        </div>
        <svg class="pizza-slice" viewBox="0 0 100 100">
            <defs>
                <linearGradient id="sliceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#fff9c4" />
                    <stop offset="40%" stop-color="#ffd740" />
                    <stop offset="100%" stop-color="#ff9800" />
                </linearGradient>
                <linearGradient id="crustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ffc107" />
                    <stop offset="100%" stop-color="#a0522d" />
                </linearGradient>
            </defs>
            <path d="M 12 22 Q 50 0 88 22 L 82 32 Q 50 14 18 32 Z" fill="url(#crustGrad)" />
            <path d="M 18 32 L 50 92 L 82 32 Q 50 14 18 32 Z" fill="url(#sliceGrad)" />
            <circle cx="38" cy="48" r="7" fill="#d32f2f" />
            <circle cx="62" cy="46" r="6" fill="#d32f2f" />
            <circle cx="50" cy="65" r="6.5" fill="#d32f2f" />
            <circle cx="36" cy="46" r="2" fill="rgba(255,255,255,0.6)" />
            <circle cx="60" cy="44" r="1.5" fill="rgba(255,255,255,0.6)" />
            <circle cx="48" cy="63" r="1.8" fill="rgba(255,255,255,0.6)" />
            <path d="M 46 88 Q 48 95 50 92 Q 52 95 54 88" fill="#ffd740" />
        </svg>
        <div class="brand-load">
            <div class="pizza-word">PIZZA</div>
            <div class="max-word">MAX</div>
        </div>
        <div class="dots-load">
            <div class="dot-load"></div>
            <div class="dot-load"></div>
            <div class="dot-load"></div>
        </div>
    </div>
</div>

<!-- ===== SCRIPT (Para ver la animación y luego ocultar) ===== -->
<script>
    // Si quieres que la animación se quede fija para siempre, borra o comenta este bloque.
    window.addEventListener("load", () => {
        setTimeout(() => {
            const loader = document.getElementById("loading-screen");
            if (loader) {
                loader.classList.add("hide");
            }
        }, 3500); // 3.5 segundos
    });
</script>

</body>
</html>
