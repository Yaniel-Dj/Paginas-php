<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargando Guías de Retroporting...</title>
  
  <style>
    /* Importar fuente de píxeles directamente en el CSS */
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    :root {
      --bg-color: #0d0d0d;
      --neon-green: #39ff14;
    }

    /* ===== ESTILOS DE LA PANTALLA DE CARGA ===== */
    
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #111 0%, #000 100%);
      transition: opacity 0.8s ease, visibility 0.8s ease;
      font-family: 'Press Start 2P', monospace;
    }

    #loading-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Efecto CRT (Líneas de escaneo) */
    .crt-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15) 0px,
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 3px
      );
      z-index: 10;
    }

    /* Logo pixelado */
    .retro-logo {
      width: 120px;
      height: 120px;
      margin-bottom: 40px;
      animation: flotar 2s ease-in-out infinite alternate;
    }

    .retro-logo svg {
      width: 100%;
      height: 100%;
      shape-rendering: crispEdges;
      filter: drop-shadow(0 0 8px var(--neon-green)) drop-shadow(0 0 15px rgba(57, 255, 20, 0.5));
    }

    /* Barra de carga */
    .loading-bar-container {
      width: 250px;
      height: 16px;
      border: 2px solid var(--neon-green);
      padding: 2px;
      position: relative;
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
    }

    .loading-bar {
      height: 100%;
      width: 0%;
      background-color: var(--neon-green);
      background-image: repeating-linear-gradient(
        90deg,
        var(--neon-green) 0,
        var(--neon-green) 6px,
        transparent 6px,
        transparent 10px
      );
      /* Animación en bucle infinito */
      animation: cargar 2s steps(15) infinite;
    }

    /* Texto */
    .loading-text {
      margin-top: 20px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--neon-green);
      text-shadow: 0 0 5px var(--neon-green);
    }

    .loading-text::after {
      content: "_";
      animation: parpadeo 0.8s step-end infinite;
    }

    /* Animaciones */
    @keyframes flotar {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }

    @keyframes cargar {
      0% { width: 0%; }
      80% { width: 100%; } /* Llega al 100% */
      100% { width: 100%; } /* Se queda lleno un instante antes de reiniciar */
    }

    @keyframes parpadeo {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* ===== ESTILOS DE TU PÁGINA (Ejemplo básico) ===== */
    body {
      margin: 0;
      background-color: #1a1a1a;
      color: white;
      font-family: system-ui, sans-serif;
    }
    
    .contenido-real {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 1. PANTALLA DE CARGA -->
  <div id="loading-screen" role="status" aria-label="Cargando">
    <div class="crt-overlay"></div>
    
    <div class="retro-logo">
      <svg viewBox="0 0 100 100">
        <g fill="none" stroke="#39ff14" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter">
          <path d="M 25 30 L 10 50 L 25 70" />
          <path d="M 75 30 L 90 50 L 75 70" />
          <path d="M 55 20 L 45 80" />
        </g>
      </svg>
    </div>

    <div class="loading-bar-container">
      <div class="loading-bar"></div>
    </div>

    <div class="loading-text">Cargando guías</div>
  </div>

  <!-- 2. EL CONTENIDO DE TU PÁGINA -->
  <main class="contenido-real">
    <h1>Guías de Retroporting</h1>
    <p>¡Bienvenido! La pantalla de carga ha terminado.</p>
  </main>

  <!-- 3. EL JAVASCRIPT -->
  <script>
    // Se ejecuta cuando todo (imágenes, textos, etc.) ha cargado
    window.addEventListener("load", () => {
      // Espera 3 segundos para que se vea el efecto antes de quitar la pantalla
      setTimeout(() => {
        const loader = document.getElementById("loading-screen");
        if (loader) {
          loader.classList.add("hide");
        }
      }, 3000); 
    });
  </script>

</body>
</html>
